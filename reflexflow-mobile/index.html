<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>ReflexFlow Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#06101b;color:#eef7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:760px;margin:auto;padding:18px 14px 80px}.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#35d9ff,#876cff);font-weight:900;font-size:23px;color:#04101a}.head h1{font-size:21px;margin:0}.muted,small{color:#87a0bc}.tag{margin-left:auto;padding:7px 10px;border:1px solid #263c56;border-radius:999px;font-size:11px;color:#87a0bc}.p{background:#0b1726;border:1px solid #20344d;border-radius:18px;padding:15px;margin:12px 0}.p h2{font-size:16px;margin:0 0 12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.g{grid-template-columns:1fr}}label{font-size:11px;color:#87a0bc;display:block;margin:0 0 5px}input,select{width:100%;border:1px solid #263c56;background:#07121f;color:#eef7ff;border-radius:11px;padding:11px}.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;color:#04101a;background:linear-gradient(90deg,#35d9ff,#876cff)}.btn2{color:#eef7ff;background:#14263a;border:1px solid #263c56}.a{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.v,.job{border:1px solid #20344d;background:#07131f;border-radius:14px;padding:12px;margin:10px 0}.vh,.jh{display:flex;align-items:center;justify-content:space-between;gap:10px}.num{font-weight:900;color:#35d9ff}.r{display:grid;grid-template-columns:1fr 58px;align-items:center;gap:8px}.r input{padding:0;accent-color:#35d9ff}.val{font-weight:800;text-align:right;font-size:12px}.bar{height:9px;background:#030a11;border-radius:999px;overflow:hidden;margin:10px 0 6px}.fill{height:100%;background:linear-gradient(90deg,#35d9ff,#876cff);transition:.4s}.state{font-size:10px;border:1px solid #263c56;border-radius:999px;padding:5px 8px;color:#9db0c4}.detail{font-size:12px;color:#87a0bc}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14263a;border:1px solid #36506e;padding:10px 14px;border-radius:12px;opacity:0;transition:.2s}.toast.on{opacity:1}.cnt{width:86px}.keyrow{display:grid;grid-template-columns:1fr auto;gap:8px}
</style></head><body><main class="w"><header class="head"><div class="logo">R</div><div><h1>ReflexFlow Mobile</h1><small>Control remoto · el render ocurre en tu PC</small></div><span class="tag" id="tag">OFF</span></header>
<section class="p"><h2>Conexión</h2><div class="keyrow"><input id="key" type="password" placeholder="Código de acceso"><button class="btn btn2" id="connect">Conectar</button></div><small id="conn">Introduce el código una sola vez.</small></section>
<section class="p"><div class="vh"><div><h2>Nuevo lote</h2><small>Configura cada video por separado.</small></div><input class="cnt" id="count" type="number" min="1" max="10" value="3"></div><div class="g" style="margin-top:10px"><div><label>Formato</label><select id="aspect"><option>9:16</option><option>16:9</option></select></div><div><label>Variación</label><select id="orig"><option value="strict">Alta variedad</option><option value="balanced">Equilibrada</option></select></div></div><div id="videos"></div><div class="a"><button class="btn" id="send">⚡ Enviar lote al PC</button><button class="btn btn2" id="refresh">Actualizar</button></div></section>
<section class="p"><h2>Trabajos</h2><div id="jobs"><small>Sin trabajos todavía.</small></div></section></main><div class="toast" id="toast"></div>
<script>
const $=x=>document.getElementById(x),API='/api/queue';let K=localStorage.rfkey||'';function T(x){$('toast').textContent=x;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2200)}function tm(s){s=Math.round(+s||0);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}async function Q(a,m='GET',b){if(!K)throw Error('Conecta primero el código.');let r=await fetch(API+'?action='+a,{method:m,headers:{'X-ReflexFlow-Key':K,'Content-Type':'application/json'},body:b?JSON.stringify(b):null,cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
function card(i){return `<div class="v"><div class="vh"><span class="num">VIDEO ${String(i).padStart(2,'0')}</span><input class="title" placeholder="Título opcional" style="max-width:56%;padding:7px"></div><div class="g" style="margin-top:10px"><div><label>Duración final</label><div class="r"><input class="dur" type="range" min="5" max="600" value="60"><span class="val dv">01:00</span></div></div><div><label>Categoría</label><select class="cat"><option value="landscapes">🏞 Paisajes</option><option value="cities">🏙 Ciudades</option><option value="mixed" selected>🌎 Paisajes + ciudades</option><option value="animals">🐾 Animales</option></select></div><div><label>Clips</label><div class="r"><input class="clip" type="range" min="3" max="5" step=".1" value="4"><span class="val cv">4.0 s</span></div></div><div><label>Transición</label><div class="r"><input class="fade" type="range" min=".1" max="1" step=".1" value=".4"><span class="val fv">0.4 s</span></div></div></div></div>`}function bind(v){let d=v.querySelector('.dur'),c=v.querySelector('.clip'),f=v.querySelector('.fade'),u=()=>{v.querySelector('.dv').textContent=tm(d.value);v.querySelector('.cv').textContent=(+c.value).toFixed(1)+' s';v.querySelector('.fv').textContent=(+f.value).toFixed(1)+' s'};[d,c,f].forEach(x=>x.oninput=u);u()}function draw(){let n=Math.max(1,Math.min(10,+$('count').value||1)),old=[...document.querySelectorAll('.v')].map(v=>[v.querySelector('.dur').value,v.querySelector('.cat').value,v.querySelector('.clip').value,v.querySelector('.fade').value,v.querySelector('.title').value]);$('count').value=n;$('videos').innerHTML=Array.from({length:n},(_,i)=>card(i+1)).join('');[...document.querySelectorAll('.v')].forEach((v,i)=>{if(old[i]){let x=old[i];v.querySelector('.dur').value=x[0];v.querySelector('.cat').value=x[1];v.querySelector('.clip').value=x[2];v.querySelector('.fade').value=x[3];v.querySelector('.title').value=x[4]}bind(v)})}function items(){return [...document.querySelectorAll('.v')].map((v,i)=>({index:i+1,duration_seconds:+v.querySelector('.dur').value,visual_category:v.querySelector('.cat').value,clip_seconds:+v.querySelector('.clip').value,fade:+v.querySelector('.fade').value,title:v.querySelector('.title').value.trim()}))}function S(s){return({queued:'EN COLA',claimed:'RECIBIDO',working:'TRABAJANDO',completed:'LISTO',completed_with_errors:'CON ERRORES',error:'ERROR'})[s]||s}function J(j){let p=Math.max(0,Math.min(100,+j.progress||0)),retry=['error','completed_with_errors'].includes(j.status)?`<button class="btn btn2 retry" data-id="${j.id}" style="padding:7px 9px;margin-top:8px">Reintentar</button>`:'';return `<div class="job"><div class="jh"><b>${j.id}</b><span class="state">${S(j.status)}</span></div><small>${j.items?.length||0} video(s)</small><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="detail"><b>${p}%</b> · ${j.currentIndex?'Video '+j.currentIndex+'/'+j.items.length+' · ':''}${j.detail||''}${j.etaSeconds?' · ETA '+tm(j.etaSeconds):''}</div>${retry}</div>`}async function load(){try{let d=await Q('list');$('jobs').innerHTML=(d.jobs||[]).map(J).join('')||'<small>Sin trabajos todavía.</small>';$('tag').textContent='ONLINE';$('conn').textContent='Conectado. Mantén ReflexFlow Studio abierto en el PC.';document.querySelectorAll('.retry').forEach(b=>b.onclick=async()=>{try{await Q('retry','POST',{id:b.dataset.id});T('Reintento enviado');load()}catch(e){T(e.message)}})}catch(e){$('tag').textContent='OFF';$('conn').textContent=e.message}}
$('key').value=K;$('connect').onclick=()=>{K=$('key').value.trim();localStorage.rfkey=K;load()};$('count').onchange=draw;$('refresh').onclick=load;$('send').onclick=async()=>{try{let d=await Q('create','POST',{settings:{aspect:$('aspect').value,originality:$('orig').value},items:items()});T('Lote '+d.job.id+' enviado');load()}catch(e){T(e.message)}};draw();if(K)load();setInterval(()=>K&&load(),5000);
</script></body></html>
